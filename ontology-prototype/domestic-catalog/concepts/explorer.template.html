<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공공데이터 개념 지도</title>
<style>
:root{font:15px/1.65 'Malgun Gothic',system-ui,sans-serif;color:#24354c;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:#215baf}header{background:#142940;color:#fff;padding:25px max(24px,calc((100vw - 1450px)/2))}header h1{font-size:26px;margin:0}header p{margin:5px 0 0;color:#cddded}.headrow{display:flex;gap:18px;justify-content:space-between;align-items:center;flex-wrap:wrap}nav{display:flex;gap:15px;flex-wrap:wrap}nav a{color:#d9e7ff;font-size:13px}.badge{font-size:12px;background:#fff0d5;color:#7b4d05;border-radius:5px;padding:4px 9px;white-space:nowrap}.wrap{max-width:1500px;margin:auto;padding:22px}.intro{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.metric{background:white;border:1px solid #dce3ec;border-radius:9px;padding:10px 18px;flex:1;min-width:180px}.metric strong{font-size:24px;display:block;color:#215692}.metric span{font-size:12px;color:#61738b}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px}.sidebar,.panel{background:white;border:1px solid #dce3ec;border-radius:10px}.sidebar{padding:15px;align-self:start;position:sticky;top:15px}.sidebar input,.sidebar select{width:100%;padding:9px;border:1px solid #c3cfdf;border-radius:6px;margin-bottom:9px}.concept-list{max-height:70vh;overflow:auto}.concept-btn{display:block;width:100%;border:0;border-bottom:1px solid #edf0f4;background:white;text-align:left;padding:10px 8px;color:#283f5a}.concept-btn small{display:block;color:#6d7c90;font-size:11px}.concept-btn.active{background:#eaf1fc;border-left:3px solid #2d64b6;padding-left:5px}.panel{padding:22px;min-width:0}h2{font-size:23px;margin:0 0 4px}h3{font-size:17px;margin:23px 0 8px}p{margin:8px 0}.muted{color:#61738b;font-size:13px}.notice{background:#fff6e6;border-left:3px solid #d19b3b;padding:10px 13px;font-size:13px;margin:15px 0}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:12px;color:#315784;background:#eef3fa;border:0;border-radius:5px;padding:5px 9px}.checks{margin:8px 0;padding-left:21px;font-size:14px}.graph{overflow:auto;border:1px solid #e4e9f0;border-radius:9px;background:#fafcff}.graph svg{display:block;width:100%;min-width:650px}.graph text{font-family:inherit}.evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.evidence-card{border:1px solid #dce3ec;border-radius:7px;padding:14px;min-width:0}.evidence-card h4{margin:5px 0;font-size:15px}.evidence-card p{overflow-wrap:anywhere}.evidence-card pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;max-height:270px;overflow:auto}.evidence-card a{font-size:12px}.status{font-size:11px;display:inline-block;color:#84520d;background:#fff2d9;padding:2px 6px;border-radius:4px}.status.source{background:#e6f4ed;color:#246247}.tabs{display:flex;gap:8px;margin:0 0 15px}.tabs button{border:1px solid #c6d2e2;background:#fff;color:#304c70;border-radius:6px;padding:8px 14px}.tabs button[aria-selected=true]{background:#225998;color:#fff;border-color:#225998}.term-form{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.term-form input,.term-form select{padding:8px;border:1px solid #bdcde0;border-radius:6px;min-width:160px}.term-form button,.more{background:#215998;color:white;border:0;border-radius:5px;padding:8px 13px}.term-row{border-bottom:1px solid #e6ebf2;padding:12px 0;overflow-wrap:anywhere}.term-row summary{cursor:pointer}.term-row small{color:#5c6f89}.term-row pre{white-space:pre-wrap;font-size:12px}.empty{padding:25px;color:#61738b}.legend{font-size:12px;color:#667992;margin:7px 0 0}.footer{font-size:12px;color:#6a788d;margin-top:18px}.hidden{display:none!important}a:focus-visible,button:focus-visible{outline:3px solid #6a9fdb;outline-offset:2px}@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static}.concept-list{max-height:240px}.evidence-grid{grid-template-columns:1fr}.wrap{padding:12px}.panel{padding:16px}.metric{min-width:140px}header{padding:22px}.graph svg{min-width:650px}}
</style></head><body>
<header><div class="headrow"><div><h1>공공데이터 개념 지도 <span class="badge">검토용 초안</span></h1><p>개념의 뜻을 정리하고, 실제 자료와 칼럼에서 근거를 찾아 연결합니다.</p></div><nav><a href="/concepts/graph">전체 지식 그래프</a><a href="/">자료 검색</a><a href="/concepts/files/model">개념 JSON</a><a href="/concepts/files/review">검토 목록</a><a href="/concepts/files/rdf">RDF</a></nav></div></header>
<main class="wrap"><div class="intro" id="counts"></div><div class="tabs" role="tablist" aria-label="보기 선택"><button id="map-tab" role="tab" aria-selected="true">개념 지도</button><button id="term-tab" role="tab" aria-selected="false">원문 용어 찾기</button></div>
<section id="map-view" class="layout"><aside class="sidebar"><label for="concept-search">개념·표현 검색</label><input id="concept-search" placeholder="예: 실업률, 학교, 지역"><label for="facet">개념의 역할</label><select id="facet"><option value="">모든 역할</option></select><div id="concept-list" class="concept-list"></div></aside><section id="detail" class="panel" aria-live="polite"></section></section>
<section id="term-view" class="panel hidden"><h2>원문 용어 찾기</h2><p>아직 공통 개념으로 정리하지 않은 표현도 탐색합니다. 같은 표기는 의미가 같은지 검토할 후보입니다.</p><form id="term-form" class="term-form"><input id="term-query" aria-label="원문 용어" placeholder="예: 감염, 재정, 에너지"><select id="term-role" aria-label="용어 출처"><option value="">모든 출처</option><option value="source_category">포털 원분류</option><option value="keyword_token_candidate">키워드 후보</option><option value="documented_field_label">명세 항목명</option><option value="documented_unit">명세 단위</option></select><button>검색</button><a href="/concepts/files/terms">전체 용어 내려받기</a></form><p id="term-count" class="muted"></p><div id="terms" aria-live="polite"></div></section>
<p class="footer" id="footer"></p></main>
<script>
const DATA=__CONCEPT_DATA__;
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=v=>{try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}};
const concepts=new Map(DATA.concepts.map(c=>[c.id,c])), receipts=new Map(DATA.evidence.map(e=>[e.id,e]));let selected='measure:unemployment-rate', showAll=false;
const roleNames={source_category:'포털 원분류',keyword_token_candidate:'키워드 후보',documented_field_label:'명세 항목명',documented_unit:'명세 단위'};
function list(){const q=$('concept-search').value.trim().toLowerCase(),kind=$('facet').value;const rows=DATA.concepts.filter(c=>(!kind||c.kind===kind)&&(!q||[c.label,c.working_definition,...c.aliases].join(' ').toLowerCase().includes(q)));$('concept-list').innerHTML=rows.map(c=>`<button class="concept-btn ${selected===c.id?'active':''}" data-concept="${esc(c.id)}">${esc(c.label)}<small>${esc(DATA.facets[c.kind].label)} · 근거 예시 ${c.displayed_evidence_examples}개</small></button>`).join('')||'<p class="empty">초안에 해당 개념이 없습니다. 원문 용어 찾기에서 확인해 보세요.</p>'}
function svgBox(id,label,sub,x,y,w,fill){return `<g ${id?`data-concept="${esc(id)}" role="button" tabindex="0" aria-label="${esc(label)}" style="cursor:pointer"`:''}><rect x="${x}" y="${y}" width="${w}" height="58" rx="8" fill="${fill}" stroke="#bfd0e4"/><text x="${x+w/2}" y="${y+25}" fill="#1e3f68" text-anchor="middle" font-size="15">${esc(label.length>21?label.slice(0,20)+'…':label)}</text><text x="${x+w/2}" y="${y+44}" fill="#5c7695" text-anchor="middle" font-size="11">${esc(sub)}</text></g>`}
function graph(c,ms){let g='<svg viewBox="0 0 940 320" role="img" aria-label="선택한 개념과 분야·원문 근거의 연결 후보"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#7f98b8"/></marker></defs>';const cx=320,cy=120;
g+=svgBox('',c.label,DATA.facets[c.kind].label+' · 정의 초안',cx,cy,240,'#e6effc');
const topics=c.topics.map(id=>concepts.get(id));if(topics.length){const t=topics[0];g+=`<path d="M320 149 L255 149" stroke="#7f98b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="284" y="135" font-size="11" text-anchor="middle" fill="#617792">분야</text>`+svgBox(t.id,t.label,'탐색용 배치 · 검토 전',20,120,230,'#f0f4f9')}else{g+=`<text x="145" y="137" text-anchor="middle" fill="#697f98" font-size="13">${c.kind==='Topic'?'여러 역할의 개념을 담는':'독립된 역할의'}</text><text x="145" y="160" text-anchor="middle" fill="#697f98" font-size="13">탐색 기준입니다.</text>`}
ms.slice(0,3).forEach((m,i)=>{const y=23+i*85;g+=`<path d="M650 ${y+29} C610 ${y+29},610 149,565 149" stroke="#7f98b8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>`+svgBox('',m.evidence.field_name||m.evidence.source_label,m.evidence.portal_id+' · 연결 후보',650,y,270,'#fff5e3')});if(!ms.length)g+='<text x="782" y="149" text-anchor="middle" fill="#697f98" font-size="13">원문 표기 근거를 추가해야 합니다.</text>';
const related=DATA.relationships.find(r=>r.predicate==='distinguishFrom'&&(r.source===c.id||r.target===c.id));if(related){const n=concepts.get(related.source===c.id?related.target:related.source);g+=`<path d="M440 178 L440 235" stroke="#bf995b" stroke-dasharray="4 4"/><text x="454" y="218" font-size="11" fill="#8d682e">구분 필요</text>`+svgBox(n.id,n.label,'자동으로 같은 개념으로 합치지 않음',320,240,240,'#fff7e9')}
return g+'</svg>'}
function evidenceCard(m){const e=m.evidence,r=receipts.get(e.evidence_id)||{},unit=e.unit_as_reported;return `<article class="evidence-card"><span class="status">의미 연결 검토 전</span> <span class="status source">${e.kind==='documented_field'?'명세 항목에서 발견':'목록 표기에서 발견'}</span><h4>${esc(e.field_name||e.source_label)} ${e.field_name_en&&e.field_name_en!==e.field_name?`<small class="muted">${esc(e.field_name_en)}</small>`:''}</h4><p class="muted">${esc(e.record_title)}<br>${esc(e.portal_id)} · ${esc(e.record_id)}</p><p>${esc(e.description_as_reported||'이 예시에 별도 항목 설명이 없습니다. 원문 문맥을 검토하세요.')}</p>${e.kind==='documented_field'?`<p class="muted">자료형: ${esc(e.datatype_as_reported||'미확인')} · 단위: ${esc(unit||'미확인')}</p>`:''}<div class="chips"><a href="${esc(safe(e.source_url||r.requested_url||e.record_url))}" target="_blank" rel="noopener noreferrer">원문 근거 ↗</a><a href="/?record=${encodeURIComponent(e.record_id)}" target="_blank" rel="noopener noreferrer">수집된 자료 상세 ↗</a></div><details><summary class="muted">원문 위치·조회일·코드 분류</summary><pre>${esc(JSON.stringify({evidence_id:e.evidence_id,source_locator:e.source_locator||e.catalog_locator||'원문 위치 미기록',metadata_locator:e.metadata_locator,extracted_definition_locator:e.extracted_definition_locator,definition_document:e.definition_document,retrieved_at:r.retrieved_at,sha256:r.sha256,receipt_status:r.status,code_context:e.code_context},null,2))}</pre></details></article>`}
function detail(id){selected=id;showAll=false;renderDetail();list();history.replaceState(null,'','#'+encodeURIComponent(id))}
function renderDetail(){const c=concepts.get(selected),ms=DATA.mappings.filter(m=>m.concept_id===selected).sort((a,b)=>Number(b.evidence.kind==='documented_field')-Number(a.evidence.kind==='documented_field')),children=DATA.relationships.filter(r=>r.predicate==='inTopic'&&r.target===selected).map(r=>concepts.get(r.source));$('detail').innerHTML=`<div class="headrow"><div><p class="muted">${esc(DATA.facets[c.kind].label)} · ${esc(c.id)}</p><h2>${esc(c.label)}</h2></div><span class="badge">사람 검토 전</span></div><p>${esc(c.working_definition)}</p><div class="notice">이 설명은 프로젝트의 작업용 정의입니다. 원문 표기 발견과 의미의 최종 승인은 구분합니다.</div><div class="graph">${graph(c,ms)}</div><p class="legend">점선: 제안된 의미 연결 · 분야 배치는 상하위 클래스나 상관관계를 뜻하지 않습니다.</p>${children.length?`<h3>이 분야에 배치한 개념</h3><div class="chips">${children.map(n=>`<button class="chip" data-concept="${esc(n.id)}">${esc(n.label)}</button>`).join('')}</div>`:''}<h3>검토할 의미와 조건</h3><ul class="checks">${c.scope_checks.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="muted">찾아볼 표현 후보: ${c.aliases.map(esc).join(' · ')}<br>표현 후보는 확정된 동의어가 아닙니다.</p><h3>실제 자료에서 발견한 근거 ${ms.length}개</h3><p class="muted">이름·표기 기준 후보 출현 ${c.candidate_occurrences_in_index.toLocaleString()}회 중 제공처별 일부 예시입니다. 출처·버전·제공기관에 따른 반복이 포함됩니다.</p><div class="evidence-grid">${(showAll?ms:ms.slice(0,6)).map(evidenceCard).join('')||'<p class="empty">정확한 표기와 일치하는 근거를 아직 선택하지 못했습니다. 원문 용어와 공식 설명에서 추가 검토하세요.</p>'}</div>${ms.length>6&&!showAll?'<p><button class="more" id="more-evidence">근거 예시 더 보기</button></p>':''}<details><summary>이 개념의 검토 결과를 남기는 방법</summary><p>검토 목록에서 해당 개념과 근거 ID를 찾아 검토자·판정·판정 이유·출처·적용 조건을 기록하세요. 파일의 판정이 자동으로 모델에 승인되는 기능은 아직 없습니다.</p><a href="/concepts/files/review">검토 목록 JSON 내려받기</a></details>`;if($('more-evidence'))$('more-evidence').onclick=()=>{showAll=true;renderDetail()}}
let termRequest=0;
async function terms(){const request=++termRequest;const q=$('term-query').value.trim(),role=$('term-role').value;$('term-count').textContent='검색 중…';$('terms').innerHTML='';try{const r=await fetch('/api/concepts/terms?'+new URLSearchParams({q,role}));if(!r.ok)throw Error('검색 서버 응답 오류');const data=await r.json();if(request!==termRequest)return;$('term-count').textContent=`용어 묶음 ${data.total.toLocaleString()}개 중 ${data.results.length}개 표시 · 원문 표기 집계이며 고유 개념 수가 아닙니다.`;$('terms').innerHTML=data.results.map(t=>`<details class="term-row"><summary><strong>${esc(t.label_as_reported)}</strong> <small>${esc(roleNames[t.role]||t.role)} · ${esc(t.portal_id)} · ${t.occurrences_in_index.toLocaleString()}회</small></summary><pre>${esc(JSON.stringify(t.examples,null,2))}</pre><p class="muted">원문에서 발견한 표기입니다. 공통 개념으로 채택하려면 의미와 문맥을 검토해야 합니다.</p></details>`).join('')||'<p class="empty">일치하는 원문 용어가 없습니다.</p>'}catch(err){if(request!==termRequest)return;$('term-count').textContent='전체 용어 검색에는 로컬 검색 서버가 필요합니다. '+err.message}}
function tab(which){const map=which==='map';$('map-view').classList.toggle('hidden',!map);$('term-view').classList.toggle('hidden',map);$('map-tab').setAttribute('aria-selected',map);$('term-tab').setAttribute('aria-selected',!map);if(!map)terms()}
$('counts').innerHTML=[['개념 초안',DATA.counts.project_concepts,'8가지 역할 · 16개 탐색 분야'],['원문 근거가 연결된 개념',DATA.counts.concepts_with_source_examples,'의미 매핑 승인과 구분'],['검토할 연결 예시',DATA.counts.mapping_examples,'사람이 승인한 의미 연결 0개'],['원문 용어 묶음',DATA.counts.source_label_buckets,'분류·키워드·명세·단위 표기']].map(([l,n,s])=>`<div class="metric">${l}<strong>${n.toLocaleString()}</strong><span>${s}</span></div>`).join('');
$('facet').innerHTML+=Object.entries(DATA.facets).map(([id,v])=>`<option value="${esc(id)}">${esc(v.label)}</option>`).join('');$('concept-search').oninput=list;$('facet').onchange=list;$('map-tab').onclick=()=>tab('map');$('term-tab').onclick=()=>tab('terms');$('term-form').onsubmit=e=>{e.preventDefault();terms()};
document.addEventListener('click',e=>{const n=e.target.closest('[data-concept]');if(n)detail(n.dataset.concept)});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-concept]')){e.preventDefault();detail(e.target.dataset.concept)}});
let hash='';try{hash=decodeURIComponent(location.hash.slice(1))}catch{}if(concepts.has(hash))selected=hash;detail(selected);$('footer').textContent=`생성: ${new Date(DATA.generated_at).toLocaleString('ko-KR')} · 등록정보 ${DATA.counts.catalog_records_scanned.toLocaleString()}건의 저장 스냅샷을 사용했습니다. 전국 개념 체계의 완전성이나 개념 수집 완료율을 뜻하지 않습니다.`;
</script></body></html>
