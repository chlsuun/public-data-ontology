<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공통 개념 사전 · 국내 공공데이터</title>
<style>body{margin:0;background:#101a2b;color:#e0e9f9;font:16px/1.7 system-ui,'Malgun Gothic',sans-serif}main{max-width:1000px;margin:auto;padding:32px 22px}a{color:#78dce0}input,select{padding:12px;font:inherit;border:1px solid #3d4d69;background:#18273d;color:inherit;border-radius:6px;max-width:100%}.filters{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#101a2b;padding:15px 0}.concept{padding:24px;background:#18273d;margin:15px 0;border:1px solid #344a66;border-radius:12px;scroll-margin-top:85px}h2{margin:0}small,.muted{color:#a8bbd5}.notice{border-left:3px solid #d1ac69;padding-left:15px}li{margin:5px 0}.aliases{color:#78dce0}button{font:inherit}</style></head><body><main>
<a href="./">← 전체 지식 그래프</a> · <a href="https://github.com/chlsuun/public-data-ontology/tree/codex/ontology-collection-share-20260915">GitHub 코드·설계서</a>
<p><a href="collection.html">최종 수집 현황과 다음 단계 ↗</a></p><h1>공통 개념 사전</h1><p class="notice">88개 개념은 프로젝트가 정리한 초안입니다. 각 포털의 공식 온톨로지라고 주장하지 않으며, 원문 표현과의 의미 일치는 사람이 검토해야 합니다.</p>
<div class="filters"><input id="q" aria-label="개념 검색" placeholder="실업률, 학교, 지역…"><select id="facet" aria-label="개념의 역할"><option value="">모든 역할</option></select></div><p id="count" aria-live="polite"></p><section id="results">개념을 읽는 중…</section></main>
<script>
const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data;
function render(){const q=document.getElementById('q').value.trim().toLowerCase(),f=document.getElementById('facet').value,cs=data.concepts.filter(c=>(!f||c.kind===f)&&(!q||[c.label,c.id,c.working_definition,...c.aliases].join(' ').toLowerCase().includes(q)));document.getElementById('count').textContent=cs.length+'개 / 전체 88개';document.getElementById('results').innerHTML=cs.map(c=>`<article class="concept" id="${esc(c.id)}"><small>${esc(data.facets[c.kind].label)} · ${esc(c.id)}</small><h2>${esc(c.label)}</h2><p>${esc(c.working_definition)}</p><p class="aliases">표현 후보: ${c.aliases.map(esc).join(' · ')}</p><strong>의미 검토 조건</strong><ul>${c.scope_checks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><a href="./?concept=${encodeURIComponent(c.id)}&view=paths">이 개념의 포털·자료·원문 연결 보기 ↗</a></article>`).join('')||'<p>현재 조건에 해당하는 개념이 없습니다.</p>'}
fetch('graph-data/overview.json').then(r=>{if(!r.ok)throw Error('개념 조회 실패');return r.json()}).then(d=>{data=d;document.getElementById('facet').innerHTML+=[...Object.entries(d.facets)].map(([k,v])=>`<option value="${esc(k)}">${esc(v.label)}</option>`).join('');render();document.getElementById('q').oninput=render;document.getElementById('facet').onchange=render;let id;try{id=decodeURIComponent(location.hash.slice(1))}catch{}if(id)document.getElementById(id)?.scrollIntoView();}).catch(e=>document.getElementById('results').textContent=e.message);
</script></body></html>
